[project]
name = "open-rag-engine"
version = "0.1.0"
description = "Open-source RAG engine: hybrid retrieval, reranking, cited answers and evaluation, running on a laptop CPU."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
authors = [{ name = "Wadi Touil" }, { name = "Ghassen Jamoussi" }]
dependencies = [
    "langchain-core>=1.7,<2",
    "langchain-classic>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.1,<2",
    "langchain-experimental>=0.4,<0.5",
    "langchain-chroma>=1.0,<2",
    "langchain-huggingface>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "sentence-transformers>=5.0",
    "torch>=2.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "langchain-openai>=1.0,<2",
]

[project.scripts]
ore = "open_rag_engine.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

# CPU-only torch everywhere: the default profile has no GPU (driver D-02), and the CUDA wheels are gigabytes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_rag_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["open_rag_engine"]
omit = ["src/open_rag_engine/factory.py"]
